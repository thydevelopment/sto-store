<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Forgot Password — STO-Store</title>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <div id="navbar"></div>

    <main class="flex-1 flex items-center justify-center px-4 py-10 md:py-16">
        <div class="w-full max-w-md">

            <!-- Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">

                <!-- Icon -->
                <div
                    class="w-14 h-14 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-2xl mx-auto mb-5">
                    🔑
                </div>

                <h1 class="text-2xl font-bold text-gray-900 text-center mb-2">
                    Forgot your password?
                </h1>
                <p class="text-gray-500 text-sm text-center mb-6">
                    No worries. Enter your email and we'll send you a reset link.
                </p>

                <form class="space-y-4"
                    onsubmit="event.preventDefault(); this.querySelector('#success').classList.remove('hidden'); this.reset();">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                        <input type="email" id="email" required placeholder="you@example.com"
                            class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>

                    <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
                        Send reset link
                    </button>

                    <!-- Success message -->
                    <div id="success"
                        class="hidden bg-green-50 border border-green-200 text-green-800 text-sm rounded-lg px-4 py-3">
                        ✅ If an account exists for that email, a reset link is on its way.
                    </div>
                </form>

                <div class="text-center mt-6">
                    <a href="login.html" class="text-sm text-indigo-600 font-medium hover:underline">
                        ← Back to sign in
                    </a>
                </div>
            </div>

            <!-- Help text -->
            <p class="text-center text-xs text-gray-400 mt-6">
                Still having trouble?
                <a href="contact.html" class="text-indigo-600 hover:underline">Contact support</a>
            </p>

        </div>
    </main>

     <script src="./scripts/global/navbar.js"></script>
    <script src="../scripts/menubar.js"></script>
    <script src="./scripts/global/footer.js"></script>
</body>

</html>
