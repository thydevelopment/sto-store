<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <title>STO-Store</title>
    <style>
        body { font-family: 'Battambang', sans-serif; }
    </style>
</head>

<body class="bg-white text-gray-800">

    <!-- Announcement -->
    <header class="bg-violet-700 text-white p-3">
        <h3 class="text-[12px] text-center uppercase">
            Complimentary delivery on orders over $75
        </h3>
    </header>

    <main>
        <!-- ================= NAVBAR ================= -->
        <nav class="sticky top-0 z-50 bg-gray-100 border-b border-gray-200 text-slate-400" id="navbar">
            <div class="flex items-center justify-between p-2 relative">

                <!-- Mobile menu button -->
                <button type="button" onclick="toggleMenu()" id="open-menu"
                        class="md:hidden text-gray-800 focus:outline-none" aria-label="Open menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <!-- Logo -->
                <div class="flex items-center">
                    <a href="../index.html" class="font-bold flex items-center">
                        <p class="bg-violet-700 text-white p-1 w-10 h-10 md:w-14 md:h-14 rounded-4xl flex items-center justify-center font-semibold">ST</p>
                        <p class="ml-2 text-[16px] hidden md:block md:text-[20px] text-sky-600">STO-Store</p>
                    </a>
                </div>

                <!-- Desktop menu -->
                <div class="hidden md:flex text-sky-700 font-semibold p-2 items-center justify-center">
                    <ul class="flex justify-between gap-6 w-full">
                        <li><a href="../newArriveal.html" class="hover:text-violet-700 shadow-2xl">New Arrivals</a></li>
                        <li><a href="../shop.html" class="hover:text-sky-700">Shop</a></li>
                        <li><a href="../collection.html" class="hover:text-sky-700">Collection</a></li>
                        <li><a href="../our-story.html" class="hover:text-sky-700">Our Story</a></li>
                        <li><a href="../login.html" class="hover:text-sky-700">Login</a></li>
                    </ul>
                </div>

                <!-- Cart -->
                <div class="flex items-center justify-center p-2 bg-violet-700 rounded-full w-10 h-10 md:w-12 md:h-12">
                    <a href="cart.html" class="text-violet-200 hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </nav>

        <!-- ================= BACKDROP ================= -->
        <div id="menu-backdrop"
             onclick="toggleMenu()"
             class="fixed inset-0 bg-black/40 z-40 opacity-0 pointer-events-none
                    transition-opacity duration-300 md:hidden"></div>

        <!-- ================= SLIDE PANEL ================= -->
        <div id="menu-panel"
             class="bg-slate-800 z-50 w-80 max-w-[80vw] h-full
                    fixed top-0 left-0
                    md:hidden
                    -translate-x-full transition-transform duration-300 ease-in-out
                    flex flex-col shadow-2xl">

            <!-- Close button -->
            <button type="button" onclick="toggleMenu()"
                    class="text-white text-[18px] w-8 h-8 rounded-full hover:bg-gray-600
                           absolute top-2 right-2 flex items-center justify-center"
                    aria-label="Close menu">
                ✕
            </button>

            <!-- Content -->
            <div class="p-4">
                <!-- Logo -->
                <div class="flex items-center">
                    <a href="../index.html" class="font-bold flex items-center">
                        <p class="bg-violet-700 text-white p-1 w-10 h-10 md:w-14 md:h-14 rounded-4xl flex items-center justify-center">ST</p>
                        <p class="ml-2 text-white text-[20px]">STO-Store</p>
                    </a>
                </div>

                <ul class="mt-6 flex flex-col gap-1">
                    <li><a href="../new-arrivals.html" class="block px-3 py-3 rounded-lg text-sm font-medium text-white hover:bg-slate-700">New Arrivals</a></li>
                    <li><a href="../shop.html" class="block px-3 py-3 rounded-lg text-sm font-medium text-white hover:bg-slate-700">Shop</a></li>
                    <li><a href="../collections.html" class="block px-3 py-3 rounded-lg text-sm font-medium text-white hover:bg-slate-700">Collection</a></li>
                    <li><a href="../our-story.html" class="block px-3 py-3 rounded-lg text-sm font-medium text-white hover:bg-slate-700">Our Story</a></li>
                    <li><a href="../login.html" class="block px-3 py-3 rounded-lg text-sm font-medium text-white hover:bg-slate-700">Login</a></li>
                </ul>
                
            </div>
            <div class="flex items-center justify-center p-2 bg-violet-700 rounded-full w-70 bottom-4 absolute  left-1/2 transform -translate-x-1/2">
                    <a href="#" class="text-violet-200 hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                    </a>
                </div>
        </div> 
    </main>

    <script src="../scripts/menubar.js"></script>
</body>

</html>
