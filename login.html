<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Sign In — STO-Store</title>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <div id="navbar"></div>

    <main class="flex-1 grid md:grid-cols-2 min-h-[calc(100vh-64px)]">

        <!-- LEFT: form -->
        <div class="flex items-center justify-center px-4 py-10 md:py-16">
            <div class="w-full max-w-sm">
                <p class="uppercase tracking-widest text-xs text-indigo-600 font-semibold mb-2">Welcome back</p>
                <h1 class="text-3xl font-bold text-gray-900 mb-1">Sign in</h1>
                <p class="text-gray-500 text-sm mb-6">Enter your details to access your account.</p>

                <form class="space-y-4" onsubmit="event.preventDefault(); alert('Signed in (demo)');">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" required placeholder="you@example.com"
                            class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                            <a href="forgot-password.html" class="text-xs text-indigo-600 hover:underline">Forgot?</a>
                        </div>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>

                    <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                        <input type="checkbox" class="accent-indigo-600"> Remember me
                    </label>

                    <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
                        Sign in
                    </button>
                </form>

                <div class="flex items-center gap-3 my-6">
                    <div class="flex-1 h-px bg-gray-200"></div>
                    <span class="text-xs text-gray-400 uppercase">or</span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button
                        class="flex items-center justify-center gap-2 border border-gray-300 bg-white hover:bg-gray-50 rounded-lg py-2.5 text-sm font-medium transition">
                        <svg class="w-4 h-4" viewBox="0 0 24 24">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.98.66-2.24 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.11A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.11V7.05H2.18A11 11 0 0 0 1 12c0 1.77.42 3.45 1.18 4.95l3.66-2.84z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z" />
                        </svg>
                        Google
                    </button>
                    <button
                        class="flex items-center justify-center gap-2 border border-gray-300 bg-white hover:bg-gray-50 rounded-lg py-2.5 text-sm font-medium transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57v-2c-3.34.73-4.04-1.6-4.04-1.6-.54-1.39-1.33-1.76-1.33-1.76-1.1-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.84 2.82 1.31 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .31.22.69.83.57A12 12 0 0 0 12 .3" />
                        </svg>
                        GitHub
                    </button>
                </div>

                <p class="text-center text-sm text-gray-600 mt-6">
                    New here?
                    <a href="register.html" class="text-indigo-600 font-medium hover:underline">Create an account</a>
                </p>
            </div>
        </div>

        <!-- RIGHT: image -->
        <div class="hidden md:block relative">
            <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200&q=80" alt="Store"
                class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/70 via-purple-900/50 to-transparent"></div>
            <div class="absolute bottom-10 left-10 right-10 text-white">
                <p class="text-2xl font-bold mb-2">Quality, delivered.</p>
                <p class="text-sm text-indigo-100 max-w-sm">
                    Thoughtfully made essentials, backed by real people and honest prices.
                </p>
            </div>
        </div>
    </main>

    <script src="./scripts/global/navbar.js"></script>
    <script src="../scripts/menubar.js"></script>
    <script src="./scripts/global/footer.js"></script>
</body>

</html>
